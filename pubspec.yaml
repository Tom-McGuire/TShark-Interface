name: tshark_interface
description: "A lightweight desktop interface for headless T-Shark packet captures."
publish_to: 'none'

version: 0.5.1-Beta

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.1.0
  intl: ^0.20.3
  dartssh2: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
