name: tshark_interface
description: "A lightweight desktop interface for headless T-Shark packet captures."
publish_to: 'none'

version: 0.7.1-Beta

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  network_suite_shared:
    git:
      url: https://github.com/Tom-McGuire/network-suite-shared.git
      ref: main

  provider: ^6.1.5+1
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.1.0
  intl: ^0.20.3
  dartssh2: ^2.9.0
  sqlite3: ^3.7.1

  material_ui: ^1.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
